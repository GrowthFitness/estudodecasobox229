<style>
  /* Layout: uma dobra só, tudo centralizado em coluna: headline, vídeo, dois botões lado a lado. */
  :root {
    --bg: #ffffff;
    --ink: #111418;
    --muted: #5f6772;
    --line: #e6e8eb;
    --blue: #1b3fd6;
    --off: 395px; /* altura reservada (headline + botões) para dimensionar o vídeo */
    --whatsapp: #25d366;
    --whatsapp-ink: #062a14;
    --font: "Outfit", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); }
  body { min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }

  .page { width: 100%; max-width: 1100px; display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center; }

  h1 {
    margin: 0;
    font-size: clamp(1.3rem, 1rem + 1.9vw, 2.3rem);
    line-height: 1.3;
    font-weight: 800;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  h1 .l { display: block; }
  h1 mark { color: var(--blue); background: none; white-space: nowrap; }
  h1 .hl { white-space: nowrap; }

  .sub { margin: -8px 0 0; color: var(--muted); font-size: 1rem; font-weight: 500; text-wrap: balance; }

  .video {
    position: relative;
    width: min(100%, 780px, calc((100svh - var(--off)) * 16 / 9));
    min-width: min(100%, 320px);
    aspect-ratio: 16 / 9;
    background: #0e1114 url("https://img.youtube.com/vi/BNhprJB4Zx8/maxresdefault.jpg") center / cover no-repeat;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .video iframe, .video button.play { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .video button.play {
    display: grid; place-items: center; cursor: pointer; border: 0; background: transparent; color: #fff; font: inherit;
  }
  .video .circle {
    width: 76px; height: 76px; border-radius: 50%; background: #fff; display: grid; place-items: center;
    transition: transform .15s ease;
  }
  .video button.play:hover .circle { transform: scale(1.06); }
  .video button.play:focus-visible { outline: 3px solid var(--whatsapp); outline-offset: -3px; }

  .ctas { width: min(100%, 780px, calc((100svh - var(--off)) * 16 / 9)); min-width: min(100%, 320px); display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 56px; padding: 14px 20px; border-radius: 12px;
    font: 800 1rem/1.2 var(--font); text-decoration: none; text-align: center;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(17, 20, 24, .14); }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .btn-main { background: var(--blue); color: #fff; }
  .btn-main:hover { box-shadow: 0 8px 20px rgba(27, 63, 214, .28); }
  .btn-wa { background: var(--whatsapp); color: var(--whatsapp-ink); }
  .btn svg { flex: none; }

  .note { margin: 0; color: var(--muted); font-size: .85rem; font-weight: 500; }

  @media (max-width: 520px) {
    .page { gap: 18px; }
    h1 { font-size: clamp(1.1rem, 5.2vw, 1.6rem); }
    body { padding: 16px; }
    .ctas { grid-template-columns: 1fr; width: 100%; }
    .video { width: 100%; }
    .video .circle { width: 60px; height: 60px; }
  }
  /* Computador: headline distribuída em 2 linhas (mesmo tamanho de letra). */
  @media (min-width: 1200px) {
    :root { --off: 330px; }
    h1 { white-space: nowrap; }
    h1 .l { display: inline; }
    h1 .l:nth-child(2)::after { content: "\A"; white-space: pre; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn, .video .circle { transition: none; }
    .btn:hover, .video button.play:hover .circle { transform: none; }
  }
</style>
</head>
<body>
  <main class="page">
    <h1>
      <span class="l">O plano que fez a Box 229</span>
      <span class="l">matricular <mark>+50 novos alunos,</mark></span>
      <span class="l"><span class="hl">organizar a gestão financeira</span></span>
      <span class="l">e <span class="hl">vender mais planos anuais</span></span>
    </h1>

    <!-- Para ativar o vídeo, cole o link de incorporação (embed) em data-src.
         Exemplo YouTube: https://www.youtube.com/embed/ID_DO_VIDEO?rel=0 -->
    <div class="video" id="video" data-src="https://www.youtube.com/embed/BNhprJB4Zx8?rel=0">
      <button class="play" type="button" aria-label="Assistir ao estudo de caso">
        <span class="circle" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="#111418"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg>
        </span>
      </button>
    </div>

    <div class="ctas">
      <a class="btn btn-main" href="https://form.respondi.app/PFkKJGY9">Consultoria gratuita</a>
      <a class="btn btn-wa" href="https://wa.me/message/KEMMM3QTG5HPE1" target="_blank" rel="noopener">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2a9.93 9.93 0 0 0-8.48 15.08L2 22l5.06-1.52A9.94 9.94 0 1 0 12.04 2Zm0 18.1a8.1 8.1 0 0 1-4.13-1.13l-.3-.18-3 .9.92-2.93-.2-.31a8.13 8.13 0 1 1 6.71 3.65Zm4.46-6.08c-.24-.12-1.44-.71-1.66-.79-.22-.08-.39-.12-.55.12-.16.24-.63.79-.77.95-.14.16-.28.18-.52.06a6.6 6.6 0 0 1-1.95-1.2 7.3 7.3 0 0 1-1.35-1.68c-.14-.24 0-.37.1-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.55-1.32-.75-1.81-.2-.47-.4-.41-.55-.42h-.47c-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2s.86 2.33.98 2.49c.12.16 1.69 2.58 4.1 3.62.57.25 1.02.4 1.37.5.58.18 1.1.16 1.51.1.46-.07 1.44-.59 1.64-1.16.2-.57.2-1.06.14-1.16-.06-.1-.22-.16-.46-.28Z"/></svg>
        Falar com equipe
      </a>
    </div>
    <p class="note">Faça sua inscrição para uma consultoria gratuita</p>
  </main>

  <script>
    // Troca a capa pelo vídeo quando a pessoa clica em play (carrega mais rápido).
    (function () {
      var box = document.getElementById('video');
      var btn = box.querySelector('button.play');
      btn.addEventListener('click', function () {
        var src = box.getAttribute('data-src');
        if (!src) return; // sem link de vídeo definido, a capa fica como está
        var sep = src.indexOf('?') > -1 ? '&' : '?';
        var f = document.createElement('iframe');
        f.src = src + sep + 'autoplay=1';
        f.allow = 'autoplay; fullscreen; picture-in-picture';
        f.allowFullscreen = true;
        f.title = 'Estudo de caso';
        box.innerHTML = '';
        box.appendChild(f);
      });
    })();
  </script>
</body>
